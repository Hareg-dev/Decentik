<!DOCTYPE html>
<html>
<head>
    <title>Decentik - Decentralized TikTok</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #000; color: #fff; }
        .container { max-width: 400px; margin: 0 auto; }
        .header { padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        .post { margin: 20px 0; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .video-container { position: relative; width: 100%; height: 400px; background: #111; }
        .post-info { padding: 15px; }
        .user-handle { font-weight: bold; color: #ff6b6b; }
        .caption { margin: 10px 0; }
        .actions { display: flex; gap: 20px; margin-top: 15px; }
        .action-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px 0; }
        .nav-items { display: flex; justify-content: space-around; max-width: 400px; margin: 0 auto; }
        .nav-btn { background: none; border: none; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Decentik</h1>
            <p>Decentralized Social Video</p>
        </div>
        
        {% for post in posts %}
        <div class="post">
            <div class="video-container">
                <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #666;">
                    📹 Video: {{ post.media_id.ipfs_hash[0..8] }}...
                </div>
            </div>
            <div class="post-info">
                <div class="user-handle">@user_{{ post.user_id }}</div>
                {% if post.caption %}
                <div class="caption">{{ post.caption }}</div>
                {% endif %}
                <div class="actions">
                    <button class="action-btn" onclick="likePost('{{ post.id }}')">❤️ Like</button>
                    <button class="action-btn" onclick="sharePost('{{ post.id }}')">🔄 Share</button>
                    <button class="action-btn" onclick="commentPost('{{ post.id }}')">💬 Comment</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    
    <div class="nav">
        <div class="nav-items">
            <button class="nav-btn" onclick="location.href='/feed'">🏠 Home</button>
            <button class="nav-btn" onclick="location.href='/upload'">➕ Upload</button>
            <button class="nav-btn" onclick="location.href='/profile/{{ user_id }}'">👤 Profile</button>
        </div>
    </div>

    <script>
        function likePost(postId) {
            fetch(`/api/posts/${postId}/like`, { method: 'POST' });
        }
        function sharePost(postId) {
            navigator.share({ url: `/posts/${postId}` });
        }
        function commentPost(postId) {
            const comment = prompt('Add a comment:');
            if (comment) {
                fetch(`/api/posts/${postId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: comment })
                });
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Upload - Decentik</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #000; color: #fff; }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }
        .upload-area { border: 2px dashed #333; border-radius: 8px; padding: 40px; text-align: center; margin: 20px 0; }
        .upload-area.dragover { border-color: #ff6b6b; background: #111; }
        .form-group { margin: 20px 0; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #333; background: #111; color: #fff; border-radius: 4px; }
        .btn { background: #ff6b6b; color: #fff; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn:disabled { background: #666; cursor: not-allowed; }
        .progress { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-bar { height: 100%; background: #ff6b6b; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 Upload Video</h1>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="upload-area" id="uploadArea">
                <p>📱 Drag & drop your video here</p>
                <p>or</p>
                <input type="file" id="videoFile" accept="video/*" style="display: none;">
                <button type="button" onclick="document.getElementById('videoFile').click()" class="btn">Choose File</button>
            </div>
            
            <div class="form-group">
                <label for="caption">Caption:</label>
                <textarea id="caption" placeholder="What's happening?" rows="3"></textarea>
            </div>
            
            <div class="progress" id="progressContainer" style="display: none;">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <button type="submit" class="btn" id="uploadBtn">🚀 Publish to Decentralized Network</button>
        </form>
        
        <div style="margin-top: 30px; padding: 20px; background: #111; border-radius: 8px;">
            <h3>🔐 Decentralized Features</h3>
            <ul>
                <li>✅ Cryptographically signed content</li>
                <li>✅ IPFS distributed storage</li>
                <li>✅ Livepeer video processing</li>
                <li>✅ AT Protocol interoperability</li>
            </ul>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const videoFile = document.getElementById('videoFile');
        const uploadForm = document.getElementById('uploadForm');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const uploadBtn = document.getElementById('uploadBtn');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                videoFile.files = files;
                uploadArea.innerHTML = `<p>📹 ${files[0].name}</p>`;
            }
        });

        videoFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadArea.innerHTML = `<p>📹 ${e.target.files[0].name}</p>`;
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!videoFile.files[0]) {
                alert('Please select a video file');
                return;
            }

            const formData = new FormData();
            formData.append('video', videoFile.files[0]);
            formData.append('caption', document.getElementById('caption').value);

            uploadBtn.disabled = true;
            progressContainer.style.display = 'block';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    progressBar.style.width = '100%';
                    alert('🎉 Video uploaded successfully to decentralized network!');
                    window.location.href = '/feed';
                } else {
                    alert('Upload failed. Please try again.');
                }
            } catch (error) {
                alert('Upload failed. Please try again.');
            } finally {
                uploadBtn.disabled = false;
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            }
        });
    </script>
</body>
</html>

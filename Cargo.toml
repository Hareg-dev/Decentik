[workspace]
members = [
    "crates/dtt-core",
    "crates/dtt-infra", 
    "crates/dtt-api",
    "crates/dtt-ui"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
axum = "0.7"
surrealdb = "1.5"
reqwest = { version = "0.11", features = ["json", "multipart"] }
ed25519-dalek = "2.0"
sha2 = "0.10"
base64 = "0.21"
jsonwebtoken = "9.0"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
async-trait = "0.1"